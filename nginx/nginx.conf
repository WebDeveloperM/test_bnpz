# BnpzTest — TLS terminatsiya va yo'naltirish. FAQAT HTTPS.
#
#   https://<server>:2000/            xodim ilovasi
#   https://<server>:2000/api/...     Django API
#   https://<server>:2000/media/...   yuklangan fayllar (rasm, video yozuvlar)
#   https://<server>:2050/            admin paneli
#   https://<server>:2050/it-center/  Django'ning o'z admin paneli (dasturchi uchun)
#
# Portlar avvalgidek (2000 / 2050) qoldirildi — xodimlarning yorliqlari va
# odatlari o'zgarmaydi, faqat protokol http'dan https'ga o'tdi.
#
# Backend (8000) tashqariga umuman chiqarilmaydi: unga faqat shu nginx
# konteyner tarmog'i ichidan murojaat qilinadi.
#
# Hamma narsa bitta manzil ostida bo'lgani uchun ilova kodida host ham, port
# ham yozilmagan (nisbiy "/api") — shu sabab "mixed content" muammosi yo'q.

# Backend'ga uzatishda ishlatiladigan umumiy sarlavhalar.
# X-Forwarded-Proto muhim: Django shu orqali so'rov HTTPS ekanini biladi va
# fayllarga havolani (build_absolute_uri) https:// bilan yasaydi. Busiz media
# manzillari http:// bo'lib qolar va brauzer ularni bloklardi.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;

# Backend manzili HAR SAFAR Docker DNS'idan so'raladi (`set $backend` + shu
# resolver). Oddiy `proxy_pass http://backend:8000` da nginx IP'ni FAQAT ishga
# tushganda bir marta aniqlaydi: backend konteyneri qayta yaratilsa (masalan
# `docker compose up -d --build backend`) va yangi IP olsa, nginx eski,
# endi mavjud bo'lmagan manzilga ulanishga urinib, HAR BIR so'rov osilib
# qolardi — backend esa so'rovni umuman ko'rmasdi va jurnal bo'sh qolardi.
resolver 127.0.0.11 valid=10s ipv6=off;

# Jurnalga so'rov vaqti ham yoziladi: rt — to'liq, urt — backend javob vaqti.
# Sekinlik qaytsa, `docker compose logs web` dan qaysi so'rov sekinligi
# darhol ko'rinadi.
log_format bnpz_timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time';

# Umumiy TLS sozlamalari (ikkala port uchun bir xil sertifikat).
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# Xodim eski odat bo'yicha shunchaki IP yozsa (http://<server>) — to'g'ri
# manzilga yuboramiz, "sahifa topilmadi" o'rniga.
server {
    listen 80;
    server_name _;
    return 301 https://$host:2000$request_uri;
}

# --- Xodim ilovasi -------------------------------------------------------
server {
    listen 2000 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Eski http:// havola aynan shu portga kelsa, nginx 497 xatosini beradi —
    # uni xato sifatida ko'rsatish o'rniga https'ga yo'naltiramiz, shunda eski
    # yorliqlar ham ishlab ketaveradi.
    error_page 497 =301 https://$host:2000$request_uri;

    access_log /var/log/nginx/access.log bnpz_timed;
    set $backend http://backend:8000;

    # Video yozuvlar (proctoring) bir necha o'nlab megabayt bo'lishi mumkin —
    # nginx'ning odatdagi 1 MB chegarasi ularni rad etardi.
    client_max_body_size 512m;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;

    root /usr/share/nginx/html/employee;
    index index.html;

    location /api/   { proxy_pass $backend; }
    # Qolgan media (jumladan video yozuvlar) — Django orqali, ruxsat tekshiruvi bilan.
    location /media/ { proxy_pass $backend; }

    # Savol/variant rasmlari va oferta videosi — FAQAT shu uch papka — nginx'ning
    # o'zidan (fayllar backend bilan bir xil papkadan, docker-compose.yml: web).
    # Ilgari ular ham Python orqali, Range'siz uzatilardi: 10 xodim testga
    # kirganda katta oferta videosi 10 marta to'liq Django orqali o'tib, shu
    # paytdagi barcha so'rovlarni sekinlashtirardi.
    #   sendfile off  — Docker Desktop'dagi Windows papkasidan sendfile katta
    #                   fayllarda osilib qoladi (avval aniqlangan muammo);
    #   aio threads   — sekin diskdan o'qish nginx'ning boshqa so'rovlarini to'smaydi;
    #   output_buffers 32k — 64 KB dan KICHIK bo'lishi SHART. Papka 9p orqali
    #                   ulangan (msize=65536) va bitta o'qishda 65 512 baytdan
    #                   ko'p qaytarmaydi; nginx esa "so'raganidan kam o'qildi"ni
    #                   xato deb hisoblab, javobni o'rtasida uzib qo'yadi
    #                   (sinovda 512k bilan aynan shunday bo'ldi: "pread() read
    #                   only 65512 of 524288"). Kattalashtirmang;
    #   try_files     — fayl topilmasa (yoki papka ulanmagan bo'lsa) Django'ga qaytadi.
    location ~ ^/media/(questions|options|offer)/ {
        root /srv;
        sendfile off;
        aio threads;
        output_buffers 2 32k;
        try_files $uri @backend;
    }
    location @backend { proxy_pass $backend; }

    # Bir sahifali ilova: mavjud bo'lmagan yo'l ham index.html'ga tushadi.
    location / { try_files $uri $uri/ /index.html; }
}

# --- Admin paneli --------------------------------------------------------
server {
    listen 2050 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    error_page 497 =301 https://$host:2050$request_uri;

    access_log /var/log/nginx/access.log bnpz_timed;
    set $backend http://backend:8000;

    client_max_body_size 512m;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/   { proxy_pass $backend; }
    location /media/ { proxy_pass $backend; }
    # Xodim portidagi bilan bir xil — izohi o'sha yerda.
    location ~ ^/media/(questions|options|offer)/ {
        root /srv;
        sendfile off;
        aio threads;
        output_buffers 2 32k;
        try_files $uri @backend;
    }
    location @backend { proxy_pass $backend; }

    # Django'ning o'z admin paneli — faqat shu portda, xodimlar ilovasida yo'q.
    location /it-center/ { proxy_pass $backend; }
    location /static/    { proxy_pass $backend; }

    location / { try_files $uri $uri/ /index.html; }
}
