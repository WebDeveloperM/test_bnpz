# BnpzTest — TLS terminatsiya va yo'naltirish. FAQAT HTTPS.
#
#   https://<server>:2000/            xodim ilovasi
#   https://<server>:2000/api/...     Django API
#   https://<server>:2000/media/...   yuklangan fayllar (rasm, video yozuvlar)
#   https://<server>:2050/            admin paneli
#   https://<server>:2050/it-center/  Django'ning o'z admin paneli (dasturchi uchun)
#
# Portlar avvalgidek (2000 / 2050) qoldirildi — xodimlarning yorliqlari va
# odatlari o'zgarmaydi, faqat protokol http'dan https'ga o'tdi.
#
# Backend (8000) tashqariga umuman chiqarilmaydi: unga faqat shu nginx
# konteyner tarmog'i ichidan murojaat qilinadi.
#
# Hamma narsa bitta manzil ostida bo'lgani uchun ilova kodida host ham, port
# ham yozilmagan (nisbiy "/api") — shu sabab "mixed content" muammosi yo'q.

# Backend'ga uzatishda ishlatiladigan umumiy sarlavhalar.
# X-Forwarded-Proto muhim: Django shu orqali so'rov HTTPS ekanini biladi va
# fayllarga havolani (build_absolute_uri) https:// bilan yasaydi. Busiz media
# manzillari http:// bo'lib qolar va brauzer ularni bloklardi.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;

# Umumiy TLS sozlamalari (ikkala port uchun bir xil sertifikat).
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# Xodim eski odat bo'yicha shunchaki IP yozsa (http://<server>) — to'g'ri
# manzilga yuboramiz, "sahifa topilmadi" o'rniga.
server {
    listen 80;
    server_name _;
    return 301 https://$host:2000$request_uri;
}

# --- Xodim ilovasi -------------------------------------------------------
server {
    listen 2000 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Eski http:// havola aynan shu portga kelsa, nginx 497 xatosini beradi —
    # uni xato sifatida ko'rsatish o'rniga https'ga yo'naltiramiz, shunda eski
    # yorliqlar ham ishlab ketaveradi.
    error_page 497 =301 https://$host:2000$request_uri;

    # Video yozuvlar (proctoring) bir necha o'nlab megabayt bo'lishi mumkin —
    # nginx'ning odatdagi 1 MB chegarasi ularni rad etardi.
    client_max_body_size 512m;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;

    root /usr/share/nginx/html/employee;
    index index.html;

    location /api/   { proxy_pass http://backend:8000; }
    location /media/ { proxy_pass http://backend:8000; }

    # Bir sahifali ilova: mavjud bo'lmagan yo'l ham index.html'ga tushadi.
    location / { try_files $uri $uri/ /index.html; }
}

# --- Admin paneli --------------------------------------------------------
server {
    listen 2050 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    error_page 497 =301 https://$host:2050$request_uri;

    client_max_body_size 512m;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/   { proxy_pass http://backend:8000; }
    location /media/ { proxy_pass http://backend:8000; }

    # Django'ning o'z admin paneli — faqat shu portda, xodimlar ilovasida yo'q.
    location /it-center/ { proxy_pass http://backend:8000; }
    location /static/    { proxy_pass http://backend:8000; }

    location / { try_files $uri $uri/ /index.html; }
}
